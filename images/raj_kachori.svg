<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="240" r="280" fill="url(#glow)"/>

  <!-- Decorative Pattern Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="400" cy="240" r="180" fill="none"/>
    <circle cx="400" cy="240" r="230" fill="none"/>
    <circle cx="400" cy="240" r="280" fill="none"/>
    <path d="M0 300 L800 300 M400 0 L400 600"/>
  </g>

  <!-- Center Plate / Serving Card -->
  <g filter="url(#dropShadow)">
    <circle cx="400" cy="220" r="130" fill="#000000" opacity="0.25"/>
    <circle cx="400" cy="210" r="125" fill="#3B0764" stroke="#C084FC" stroke-width="3"/>
    <circle cx="400" cy="210" r="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="6,6"/>
    
    <!-- Dish Icon / Emoji -->
    <text x="400" y="240" font-size="110" text-anchor="middle" dominant-baseline="middle" filter="url(#dropShadow)">👑</text>
  </g>

  <!-- Dish Category Pill -->
  <g transform="translate(400, 360)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#C084FC" opacity="0.9" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1.5">KING OF CHAATS</text>
  </g>

  <!-- Dish Title -->
  <text x="400" y="425" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#dropShadow)">Crispy Raj Kachori Chaat</text>

  <!-- Subtitle Description -->
  <text x="400" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#C084FC" text-anchor="middle">Giant Hollow Kachori Stuffed with Sprouts, Dahi &amp; Chutneys</text>

  <!-- Divider Line -->
  <line x1="250" y1="500" x2="550" y2="500" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Details / Serving Info -->
  <text x="400" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#E2E8F0" font-style="italic" text-anchor="middle">✨ Overflowing with Moong Sprouts, Sweet Dahi &amp; Pomegranate</text>
</svg>